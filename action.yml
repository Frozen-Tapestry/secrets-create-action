name: project-secrets-create
description: "Writes secrets to a directory"
branding:
  icon: lock
  color: gray-dark
inputs:
  pairs:
    description: |
      Multiline list of secrets.
      Supports key=value (single-line) and key<<DELIM...DELIM (multiline).
      key becomes filename under the secret dir.
      Example:
        secret_name1=secret_value1
        secret_name2=secret_value2
    required: true
  dir:
    description: "Directory to write secret files into"
    required: false
    default: ".ci-secrets"
  owner:
    description: "chown owner:group to apply to dir and files"
    required: false
    default: "1000:1000"
  fail_on_empty:
    description: "Fail if any value is empty"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Prepare build secrets
      shell: /bin/bash --noprofile --norc -euo pipefail {0}
      env:
        # We map the input to an env var to avoid a shell quote injection
        INPUT_PAIRS: ${{ inputs.pairs }}
      run: |
        # 1. Check .dockerignore
        if [[ ! -f .dockerignore ]]; then
          echo ".dockerignore not found"
          exit 1
        fi
        dir='${{ inputs.dir }}'
        case "$dir" in
          /*|*..* ) echo "Refusing unsafe dir path: $dir"; exit 1 ;;
        esac
        grep -qxF "$dir" .dockerignore || { echo "Secrets ignore does not exist"; exit 1; }

        # 2. Setup directory
        umask 077
        mkdir -p "$dir"

        fail_on_empty='${{ inputs.fail_on_empty }}'
        fail_on_empty="${fail_on_empty,,}"  # to lowercase

        # 3. Parse secrets from env var
        write_secret() {
          local key="$1"
          local val="$2"

          # Security: Strict filename validation
          if [[ ! "$key" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid key/filename: $key"
            exit 1
          fi

          if [[ "$fail_on_empty" == "true" && -z "$val" ]]; then
            echo "Empty secret value for: $key"
            exit 1
          fi

          printf '%s' "$val" > "$dir/$key"
        }

        heredoc_key=""
        heredoc_delim=""
        heredoc_val=""
        regex_single='^([^=[:space:]]+)[[:space:]]*=(.*)$'
        regex_heredoc='^([^=[:space:]]+)[[:space:]]*<<[[:space:]]*([A-Za-z0-9._-]+)$'

        while IFS= read -r line || [[ -n "$line" ]]; do
          if [[ -n "$heredoc_key" ]]; then
            if [[ "$line" == "$heredoc_delim" ]]; then
              write_secret "$heredoc_key" "$heredoc_val"
              heredoc_key=""
              heredoc_delim=""
              heredoc_val=""
            else
              if [[ -n "$heredoc_val" ]]; then
                heredoc_val+=$'\n'
              fi
              heredoc_val+="$line"
            fi
            continue
          fi

          # Remove leading/trailing whitespace from control lines.
          trimmed="$line"
          trimmed="${trimmed#"${trimmed%%[![:space:]]*}"}"
          trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
          [[ -z "$trimmed" ]] && continue
          [[ "$trimmed" =~ ^# ]] && continue

          if [[ "$trimmed" =~ $regex_single ]]; then
            key="${BASH_REMATCH[1]}"
            val="${BASH_REMATCH[2]}"
            write_secret "$key" "$val"
          elif [[ "$trimmed" =~ $regex_heredoc ]]; then
            heredoc_key="${BASH_REMATCH[1]}"
            heredoc_delim="${BASH_REMATCH[2]}"
            heredoc_val=""
          else
            echo "Invalid pairs line. Use key=value or key<<DELIM: $line"
            exit 1
          fi
        done <<< "$INPUT_PAIRS"

        if [[ -n "$heredoc_key" ]]; then
          echo "Unterminated multiline value for: $heredoc_key (missing delimiter '$heredoc_delim')"
          exit 1
        fi

        # 4. Secure Ownership
        owner='${{ inputs.owner }}'
        chown "$owner" "$dir" "$dir"/*
